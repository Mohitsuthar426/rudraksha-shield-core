<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUDRAKSHA SHIELD // COMMERCIAL PORTAL</title>
    <style>
        body {
            background-color: #030712;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .card {
            border: 2px solid #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            width: 100%;
            max-width: 480px;
            padding: 20px;
            background: #050b14;
        }
        .header {
            text-align: center;
            border-bottom: 2px dashed #00ff66;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        input {
            width: 95%;
            background: #000;
            border: 1px solid #00ff66;
            color: #00ff66;
            padding: 10px;
            margin: 6px 0 12px 0;
            font-family: inherit;
            outline: none;
        }
        button {
            width: 100%;
            background: #00ff66;
            color: #000;
            font-weight: bold;
            padding: 12px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            margin-top: 8px;
        }
        button:active { background: #38bdf8; }
        .tab-bar { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { background: #0b1329; color: #94a3b8; padding: 8px; border: 1px solid #1e293b; }
        .tab-btn.active { color: #00ff66; border-color: #00ff66; }
        .alert-box { padding: 10px; margin-top: 10px; border: 1px solid #38bdf8; background: #020617; font-size: 0.85em; color: #38bdf8; display: none; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>🛡️ RUDRAKSHA SHIELD</h2>
        <div style="color:#38bdf8; font-size:0.8em;">COMMERCIAL AUTH & UPGRADE PORTAL</div>
    </div>

    <div class="tab-bar" id="tabBar">
        <button class="tab-btn active" id="tabLogin" onclick="showTab('login')">LOGIN</button>
        <button class="tab-btn" id="tabReg" onclick="showTab('register')">REGISTER</button>
    </div>

    <!-- Login Form -->
    <div id="loginSection">
        <label>EMAIL:</label>
        <input type="email" id="logEmail" placeholder="admin@example.com">
        <label>PASSWORD:</label>
        <input type="password" id="logPass" placeholder="••••••••">
        <button onclick="doLogin()">⚡ LOGIN TO DASHBOARD</button>
    </div>

    <!-- Register Form -->
    <div id="regSection" style="display:none;">
        <label>NAME / COMPANY:</label>
        <input type="text" id="regName" placeholder="My Enterprise">
        <label>EMAIL:</label>
        <input type="email" id="regEmail" placeholder="admin@example.com">
        <label>PASSWORD:</label>
        <input type="password" id="regPass" placeholder="••••••••">
        <button onclick="doRegister()">⚡ CREATE ACCOUNT</button>
    </div>

    <!-- User Dashboard (After Login) -->
    <div id="dashSection" style="display:none;">
        <div style="color:#facc15; font-weight:bold; font-size:1.1em;">✓ AUTHENTICATION SUCCESS</div>
        <div style="margin-top:10px; font-size:0.9em; line-height: 1.6;">
            User: <strong id="uName" style="color:#fff;"></strong><br>
            Email: <span id="uEmail" style="color:#cbd5e1;"></span><br>
            Current Plan: <span id="uPlan" style="color:#38bdf8; font-weight:bold;"></span><br>
            License Key: <span id="uLic" style="color:#facc15; font-weight:bold;"></span><br>
            Expiry: <span id="uExp" style="color:#94a3b8;"></span>
        </div>

        <div id="upgradeBox" style="margin-top:15px; border: 1px dashed #facc15; padding: 10px; background:#080d1a;">
            <div style="color:#facc15; font-weight:bold;">⭐ UPGRADE TO ENTERPRISE</div>
            <div style="font-size:0.8em; color:#cbd5e1; margin: 4px 0 8px 0;">₹24,999 / Year - Unlock All 23 Modules & Swarm Engine</div>
            <button style="background:#facc15;" onclick="doUpgrade()">💳 SIMULATE RAZORPAY PAYMENT</button>
        </div>

        <button style="background:#dc2626; color:#fff; margin-top:12px;" onclick="location.reload()">LOGOUT</button>
    </div>

    <div class="alert-box" id="msgBox"></div>
</div>

<script>
let currentEmail = "";

function showTab(t) {
    if (t === 'login') {
        document.getElementById('tabLogin').classList.add('active');
        document.getElementById('tabReg').classList.remove('active');
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('regSection').style.display = 'none';
    } else {
        document.getElementById('tabReg').classList.add('active');
        document.getElementById('tabLogin').classList.remove('active');
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('regSection').style.display = 'block';
    }
}

function showMsg(m, isErr=false) {
    const box = document.getElementById('msgBox');
    box.style.display = 'block';
    box.style.borderColor = isErr ? '#f43f5e' : '#38bdf8';
    box.style.color = isErr ? '#f43f5e' : '#38bdf8';
    box.innerText = m;
}

async function doRegister() {
    const name = document.getElementById('regName').value;
    const email = document.getElementById('regEmail').value;
    const pass = document.getElementById('regPass').value;

    const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name: name, email: email, password: pass})
    });
    const data = await res.json();
    showMsg(data.message, data.status !== 'SUCCESS');
    if (data.status === 'SUCCESS') showTab('login');
}

async function doLogin() {
    const email = document.getElementById('logEmail').value;
    const pass = document.getElementById('logPass').value;

    const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email: email, password: pass})
    });
    const data = await res.json();

    if (data.status === 'SUCCESS') {
        currentEmail = data.user.email;
        document.getElementById('tabBar').style.display = 'none';
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('regSection').style.display = 'none';
        document.getElementById('dashSection').style.display = 'block';
        document.getElementById('msgBox').style.display = 'none';

        document.getElementById('uName').innerText = data.user.name;
        document.getElementById('uEmail').innerText = data.user.email;
        document.getElementById('uPlan').innerText = data.user.plan;
        document.getElementById('uLic').innerText = data.user.license_key;
        document.getElementById('uExp').innerText = data.user.valid_until;

        if (data.user.plan === 'ENTERPRISE_UNLIMITED') {
            document.getElementById('upgradeBox').style.display = 'none';
        }
    } else {
        showMsg(data.message, true);
    }
}

async function doUpgrade() {
    if (!currentEmail) return;
    const ok = confirm("Confirm payment of ₹24,999 for Enterprise License?");
    if (!ok) return;

    const res = await fetch('/api/payment/upgrade', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email: currentEmail})
    });
    const data = await res.json();

    if (data.status === 'SUCCESS') {
        alert(data.message);
        document.getElementById('uPlan').innerText = data.plan;
        document.getElementById('uLic').innerText = data.license_key;
        document.getElementById('uExp').innerText = data.valid_until;
        document.getElementById('upgradeBox').style.display = 'none';
    }
}
</script>

</body>
</html>
